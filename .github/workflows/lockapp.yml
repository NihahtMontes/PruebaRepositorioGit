# Compila LockApp, ejecuta las pruebas unitarias y lint, la prueba en un
# emulador de Android 14 y, si todo pasa, publica el APK en "Releases".
name: LockApp CI

on:
  push:
    branches: [lockapp]
  workflow_dispatch:

concurrency:
  group: lockapp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace

      - name: Comprobar permisos del APK (sin INTERNET)
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permisos.txt
          if grep -q "android.permission.INTERNET" permisos.txt; then
            echo "::error::La app no debe pedir el permiso INTERNET"
            exit 1
          fi

      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Guardar informe de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-lint
          path: app/build/reports/
          if-no-files-found: ignore

  e2e:
    name: Prueba en emulador (Android 14)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Activar aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar la prueba de extremo a extremo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash scripts/e2e/run.sh apk/app-debug.apk

      - name: Guardar capturas y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultados
          path: e2e-output/
          if-no-files-found: ignore

  release:
    name: Publicar APK verificado
    needs: [build, lint, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/app-debug.apk LockApp.apk
          gh release delete lockapp-latest --cleanup-tag --yes || true
          gh release create lockapp-latest LockApp.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "LockApp (última versión verificada)" \
            --notes "APK de LockApp compilado y verificado automáticamente: pruebas unitarias, lint y prueba completa en un emulador de Android 14. Commit ${{ github.sha }}. Descarga LockApp.apk desde el teléfono e instálalo; los pasos están en el README de la rama lockapp."
